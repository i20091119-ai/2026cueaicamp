async function firestoreStore() {
  const { initializeApp } = await import(FB + 'firebase-app.js');
  const f = await import(FB + 'firebase-firestore.js');
  const db = f.getFirestore(initializeApp(firebaseConfig));
  return {
    set: (id, d) => f.setDoc(f.doc(db, COL, id), d, { merge: true }),
    put: (id, d) => f.setDoc(f.doc(db, COL, id), d),
    del: id => f.deleteDoc(f.doc(db, COL, id)),
    // 읽기 횟수를 줄이려고 알티노 문서(kind = alt)만 듣는다
    watch: cb => f.onSnapshot(f.query(f.collection(db, COL), f.where('kind', '==', KIND)), s => cb(s.docs.map(d => Object.assign({ id: d.id }, d.data()))), e => fatal(e))
  };
}
function mockStore() {
  const K = 'alt_mockdb';
  const read = () => { try { return JSON.parse(localStorage.getItem(K)) || {}; } catch (e) { return {}; } };
  const subs = []; const fire = () => subs.slice().forEach(s => s());
  const merge = (a, b) => { const o = Object.assign({}, a); for (const k in b) o[k] = (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])) ? merge(o[k] || {}, b[k]) : b[k]; return o; };
  window.addEventListener('storage', fire);
  return {
    set: async (id, d) => { const db = read(); db[id] = merge(db[id] || {}, d); localStorage.setItem(K, JSON.stringify(db)); fire(); },
    put: async (id, d) => { const db = read(); db[id] = d; localStorage.setItem(K, JSON.stringify(db)); fire(); },
    del: async id => { const db = read(); delete db[id]; localStorage.setItem(K, JSON.stringify(db)); fire(); },
    watch: cb => { const fn = () => cb(Object.entries(read()).map(([id, d]) => Object.assign({ id }, d))); subs.push(fn); Promise.resolve().then(fn); }
  };
}

    const m = l.match(/^(\d{1,2})\s*(?:팀|번)?[\s,\t]+(.*?)[\s,\t]*([\d\-\s]{4,})?$/);
    if (!m || !m[2] || +m[1] < 1 || +m[1] > 60) { bad.push(l); return; }
    out.push({ team: +m[1], name: m[2].replace(/[,\t]/g, ' ').trim().slice(0, 12) });
  });
  return { out, bad };
}

  c.appendChild(el('div', 'hint', '명단을 등록하면 모든 화면에 명단의 가족만 이름과 함께 나옵니다. 명단이 없으면 1~' + TEAMS + '번이 나옵니다. 지금 등록된 가족: ' + n + '. 새로 등록하면 이전 명단은 지워지고, 이미 입력한 점수는 번호 기준으로 그대로 남습니다.'));
  const ta = el('textarea'); ta.rows = 10; ta.placeholder = '한 줄에 한 가족: 번호, 이름 (전화번호가 뒤에 붙어 있어도 됨)\n1 홍길동\n2 김철수';
  ta.style.cssText = 'width:100%;font:inherit;font-size:16px;padding:12px;border:3px solid #BFE3F2;border-radius:20px;margin-top:10px'; ta.setAttribute('aria-label', '명단 붙여넣기'); c.appendChild(ta);
  const bar = el('div', 'bar'); bar.style.marginTop = '10px';
  const go = el('button', null, '명단 등록'), msg = el('span', 'saved', rosterMsg);
  go.onclick = async () => {
    const { out, bad } = parseRoster(ta.value);
    if (!out.length || bad.length) { msg.textContent = bad.length ? '읽지 못한 줄: ' + bad[0] : '명단을 붙여 넣어 주세요'; msg.style.color = 'var(--brick)'; return; }
    msg.textContent = '등록 중…';
    try { await S.put(PRE + 'roster', { kind: KIND, teams: out, ts: Date.now() }); rosterMsg = out.length + '가족 등록됨'; } catch (e) { console.error(e); rosterMsg = '등록 실패 — 다시 눌러 주세요'; }
    render();
  };
  bar.appendChild(go); bar.appendChild(msg); c.appendChild(bar);
  if (n) { const g = el('div', 'hint'); g.style.marginTop = '12px'; g.textContent = roster.teams.slice().sort((a, b) => a.team - b.team).map(t => t.team + '번 ' + t.name).join(' · '); c.appendChild(g); }
  body.appendChild(c);
}
/* ---------- 숨은 기능: 위쪽 알티노를 7번 누르면 전체 지우기가 나온다 ---------- */
let robotTaps = 0, wipeOpen = false, wipeArm = '', wipeMsg = '';
function viewWipe(body) {
  const c = el('div', 'card'); c.style.borderColor = '#F08A6C';
  c.appendChild(el('h2', null, '전체 지우기')); c.lastChild.style.fontSize = '28px';
  c.appendChild(el('div', 'hint', '연습 때 넣은 점수를 비울 때만 씁니다. 지운 내용은 되돌릴 수 없습니다. 명단은 지워지지 않습니다. 한 번 누르면 확인 문구로 바뀌고, 한 번 더 눌러야 지워집니다.'));
  const bar = el('div', 'bar'); bar.style.marginTop = '12px';
  const label = '심사 점수 모두 지우기', armed = wipeArm === 'score';
  const b = el('button', armed ? '' : 'ghost', armed ? '정말 지우기 — 한 번 더 누르기' : label);
  if (armed) { b.style.background = '#B44A33'; b.style.boxShadow = '0 5px 0 #7A2E22'; }
  b.onclick = async () => {
    if (!armed) { wipeArm = 'score'; wipeMsg = ''; render(); return; }
    wipeArm = ''; wipeMsg = '지우는 중…'; render();
    try { const ids = Object.values(data).map(r => r.id); for (const id of ids) await S.del(id); wipeMsg = '점수 ' + ids.length + '건 지움'; } catch (e) { console.error(e); wipeMsg = '지우지 못했습니다. 다시 눌러 주세요.'; }
    render();
  };
  bar.appendChild(b);
  const x = el('button', 'ghost small', '닫기'); x.onclick = () => { wipeOpen = false; wipeArm = ''; wipeMsg = ''; robotTaps = 0; render(); }; bar.appendChild(x);
  if (wipeMsg) bar.appendChild(el('span', 'saved', wipeMsg));
  c.appendChild(bar); body.appendChild(c);
}
function render() {
  const seg = $('mode'); seg.textContent = '';
  [['arena', '경기장 판정'], ['intv', '면접'], ['result', '결과'], ['roster', '명단']].forEach(([k, t]) => { const b = el('button', k === mode ? 'on' : '', t); b.onclick = () => { mode = k; flash = ''; try { sessionStorage.setItem('alt_mode', k); } catch (e) {} render(); }; seg.appendChild(b); });
  const body = $('body'), y = window.scrollY; body.textContent = '';
  if (mode === 'arena') viewArena(body); else if (mode === 'intv') viewIntv(body); else if (mode === 'roster') viewRoster(body); else viewResult(body);
  if (wipeOpen) viewWipe(body);
  window.scrollTo(0, y);
}

function enter() { try { sessionStorage.setItem('alt_ok', '1'); mode = sessionStorage.getItem('alt_mode') || 'arena'; } catch (e) {} show('main'); render(); }
document.querySelector('.top .mascot').addEventListener('click', () => { if (++robotTaps >= 7 && !wipeOpen) { wipeOpen = true; render(); window.scrollTo(0, document.body.scrollHeight); } });
$('btn-login').onclick = () => { if ($('in-pw').value === ADMIN_PW) enter(); else $('login-err').textContent = '비밀번호가 다릅니다.'; };
$('in-pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-login').click(); });
try {
  S = new URLSearchParams(location.search).has('mock') ? mockStore() : await firestoreStore();
  let first = true, ok = false; try { ok = sessionStorage.getItem('alt_ok') === '1'; } catch (e) {}
  S.watch(list => {
    data = {}; names = {}; roster = null;
    list.forEach(r => { if (r.id === PRE + 'roster') { roster = r; (r.teams || []).forEach(t => { names[t.team] = t.name; }); } else if (r.id.indexOf(PRE) === 0 && r.team) data[r.team] = r; });
    if (first) { first = false; if (ok) enter(); else show('login'); return; }
    if (!$('v-main').classList.contains('hide') && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) render();
  });
} catch (e) { fatal(e); }
</script>
